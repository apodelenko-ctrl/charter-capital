<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>CC · Задачи</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0e12; --surface: #141820; --surface2: #1a2030; --border: #2a3344;
      --text: #e8ecf4; --muted: #8b95a8; --gold: #c9a84c; --gold-dim: rgba(201,168,76,.15);
      --red: #f87171; --amber: #fbbf24; --blue: #60a5fa; --radius: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "IBM Plex Sans", system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; min-height: 100vh; }

    .gate {
      min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: radial-gradient(ellipse at 50% 0%, var(--gold-dim), transparent 60%), var(--bg);
    }
    .gate-card {
      width: min(400px, 100%); background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 28px;
    }
    .gate-card .logo { font-size: 13px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
    .gate-card h2 { font-size: 22px; margin: 6px 0 4px; }
    .gate-card h2 span { color: var(--gold); }
    .gate-card .hint { font-size: 12px; color: var(--muted); margin-top: 12px; }
    .gate-card input {
      width: 100%; margin-top: 16px; padding: 12px 14px; border-radius: var(--radius);
      border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 14px;
    }
    .btn {
      border: 1px solid var(--border); background: var(--gold-dim); color: var(--gold);
      border-radius: var(--radius); padding: 8px 14px; font-size: 13px; cursor: pointer;
    }
    .btn:hover { border-color: var(--gold); }
    .btn.primary { background: var(--gold); color: #0c0e12; border-color: var(--gold); font-weight: 600; }
    .btn.sm { padding: 4px 10px; font-size: 12px; }
    .btn.danger { color: var(--red); border-color: rgba(248,113,113,.35); }
    .btn-icon { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; padding: 2px 6px; }
    .btn-icon:hover { color: var(--gold); }
    .btn-icon.danger:hover { color: var(--red); }

    .wrap { max-width: 1200px; margin: 0 auto; padding: 24px 16px 64px; }
    header { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
    .brand { font-size: 13px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
    h1 { font-size: 26px; font-weight: 600; margin-top: 4px; }
    h1 span { color: var(--gold); }
    .meta { font-size: 13px; color: var(--muted); margin-top: 6px; }
    .head-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .stats { display: flex; flex-wrap: wrap; gap: 10px; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; min-width: 90px; }
    .stat b { display: block; font-size: 22px; font-family: "IBM Plex Mono", monospace; }
    .stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; }
    .stat.overdue b { color: var(--red); }

    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; align-items: center; }
    .edit-toolbar { margin-bottom: 16px; gap: 8px; }
    .filter-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
    .filter-btn.active { background: var(--gold-dim); border-color: var(--gold); color: var(--gold); }
    .search { flex: 1; min-width: 200px; max-width: 320px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 12px; color: var(--text); font-size: 14px; }
    #sync-status { font-size: 12px; color: var(--muted); margin-left: auto; }

    .task-list { display: flex; flex-direction: column; gap: 10px; }
    .task-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .task-card.done { opacity: .55; }
    .task-head { display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center; padding: 14px 16px; cursor: pointer; }
    .task-head:hover { background: var(--surface2); }
    .expand { width: 28px; height: 28px; border-radius: 6px; background: var(--surface2); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--gold); transition: transform .2s; }
    .task-card.open .expand { transform: rotate(90deg); }
    .task-title { font-weight: 600; font-size: 15px; }
    .task-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .task-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: flex-end; }
    .badge { font-size: 11px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--border); }
    .badge.cat { color: var(--blue); border-color: rgba(96,165,250,.3); }
    .badge.deadline { font-family: "IBM Plex Mono", monospace; }
    .badge.deadline.overdue { color: var(--red); border-color: rgba(248,113,113,.4); background: rgba(248,113,113,.08); }
    .badge.deadline.soon { color: var(--amber); border-color: rgba(251,191,36,.4); }
    .owner { font-size: 11px; padding: 3px 8px; border-radius: 999px; background: var(--gold-dim); color: var(--gold); border: 1px solid rgba(201,168,76,.3); }
    .task-body { display: none; border-top: 1px solid var(--border); padding: 0 16px 16px; }
    .task-card.open .task-body { display: block; }
    .task-link { display: inline-block; margin: 12px 0 8px; font-size: 13px; color: var(--gold); text-decoration: none; }
    .task-edit-bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
    .subs { display: flex; flex-direction: column; gap: 8px; }
    .sub { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; display: grid; grid-template-columns: 28px 1fr; gap: 10px; }
    .sub.done { opacity: .5; }
    .sub.done .sub-title { text-decoration: line-through; }
    .sub-head { display: flex; justify-content: space-between; gap: 8px; }
    .sub-title { font-weight: 500; font-size: 14px; }
    .sub-what { font-size: 13px; color: var(--muted); margin: 6px 0 8px; }
    .sub-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; }
    .notice { background: rgba(96,165,250,.12); color: var(--blue); border: 1px solid rgba(96,165,250,.25); padding: 2px 8px; border-radius: 999px; font-size: 11px; }
    .contact { color: var(--muted); font-style: italic; }
    .sub-links { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 8px; }
    .sub-links a { font-size: 12px; color: var(--gold); }

    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,.65); display: grid; place-items: center;
      padding: 16px; z-index: 100;
    }
    .modal-card {
      width: min(520px, 100%); max-height: 90vh; overflow: auto;
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px;
    }
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .modal-head h3 { font-size: 16px; }
    #edit-form label { display: block; margin-bottom: 12px; font-size: 12px; color: var(--muted); }
    #edit-form input, #edit-form textarea, #edit-form select {
      display: block; width: 100%; margin-top: 4px; padding: 8px 10px;
      border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 14px;
    }
    #edit-form textarea { min-height: 72px; resize: vertical; }
    .form-actions { display: flex; gap: 8px; margin-top: 16px; }

    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--surface2); border: 1px solid var(--gold); color: var(--text);
      padding: 10px 18px; border-radius: 999px; font-size: 13px; z-index: 200;
    }
    .empty { text-align: center; padding: 48px; color: var(--muted); }
    footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 16px; }
    footer a { color: var(--gold); }
    @media (max-width: 640px) {
      .task-head { grid-template-columns: 32px 1fr; }
      .task-meta { grid-column: 2; justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <div id="gate" class="gate">
    <div class="gate-card">
      <div class="logo">Charter Capital · internal</div>
      <h2>Задачи <span>· ops</span></h2>
      <p class="hint">Тот же пароль, что у Control Tower (DASHBOARD_SECRET).</p>
      <input id="secret" type="password" placeholder="Пароль" autocomplete="current-password">
      <button id="enter-btn" class="btn primary" type="button" style="width:100%;margin-top:12px;padding:12px">Войти</button>
    </div>
  </div>

  <div id="app" class="wrap" hidden>
    <header>
      <div>
        <div class="brand">Charter Capital · internal</div>
        <h1>Задачи <span>· ops</span></h1>
        <p class="meta">Синхронизация между командой · редактирование на месте</p>
      </div>
      <div>
        <div class="head-actions">
          <button id="refresh-btn" class="btn" type="button" title="Обновить">↻</button>
          <button id="edit-toggle" class="btn" type="button">✎ Редактировать</button>
          <button id="logout-btn" class="btn" type="button">Выйти</button>
        </div>
        <div class="stats" id="stats"></div>
      </div>
    </header>

    <div class="toolbar">
      <label>Ответственный:</label>
      <div id="owner-filters"></div>
      <input type="search" class="search" id="search" placeholder="Поиск…">
      <span id="sync-status">—</span>
    </div>

    <div class="toolbar edit-toolbar" id="edit-toolbar" hidden>
      <button id="add-task-btn" class="btn sm" type="button">+ Новый блок</button>
      <button id="save-btn" class="btn sm primary" type="button">Сохранить всё</button>
    </div>

    <div class="task-list" id="task-list"></div>
    <div class="empty" id="empty" hidden>Ничего не найдено</div>

    <footer>
      <span>Секретная ссылка · noindex</span>
      <a href="https://cc-pipeline-three.vercel.app/pipeline-cc-secure-7f3a9k2x" target="_blank" rel="noopener">Воронка</a>
      <a href="https://ccapital-control-tower.wegc.workers.dev/" target="_blank" rel="noopener">Control Tower</a>
    </footer>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="modal-title">Редактировать</h3>
        <button id="modal-close" class="btn-icon" type="button">×</button>
      </div>
      <form id="edit-form"></form>
      <div class="form-actions">
        <button class="btn primary" type="submit" form="edit-form">Применить</button>
        <button id="modal-cancel" class="btn" type="button">Отмена</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="cc-tasks-data.js"></script>
  <script src="cc-tasks-app.js"></script>
  <script>
    document.getElementById("modal-cancel").onclick = () => document.getElementById("modal-close").click();
  </script>
</body>
</html>
