<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Charter Capital · Control Tower</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="gate" class="gate">
    <div class="gate-card">
      <div class="logo">Charter Capital</div>
      <div class="logo-sub">Control Tower · внутренний доступ</div>
      <input id="secret" type="password" placeholder="Пароль" autocomplete="current-password" autofocus>
      <button id="enter-btn" class="btn" type="button">Войти</button>
      <p class="hint">Пароль DASHBOARD_SECRET (см. ccapital-accesses.md). Enter — войти.</p>
    </div>
  </div>

  <div id="app" hidden>
    <header class="topbar">
      <div>
        <div class="brand">Charter Capital · Control Tower</div>
        <div class="subtitle" id="subtitle">Мониторинг автоматизаций ccapital.pro</div>
      </div>
      <div class="top-actions">
        <a class="link-gold" href="https://cc-pipeline-three.vercel.app/pipeline-cc-secure-7f3a9k2x" target="_blank" rel="noopener">Воронка ↗</a>
        <a class="link-gold" href="https://ccapital.pro/" target="_blank" rel="noopener">ccapital.pro ↗</a>
        <button class="btn ghost" id="refresh" type="button">↻</button>
      </div>
    </header>

    <nav class="tabs" id="tabs">
      <button class="tab active" data-panel="overview">Светофор</button>
      <button class="tab" data-panel="publish">Публикация</button>
      <button class="tab" data-panel="leads">Лиды</button>
      <button class="tab" data-panel="traffic">Трафик</button>
      <button class="tab" data-panel="content">Контент</button>
      <button class="tab" data-panel="dzen">Дзен</button>
      <button class="tab" data-panel="tasks">Задачи</button>
      <button class="tab" data-panel="logs">Логи</button>
    </nav>

    <main id="panel"></main>
  </div>

  <div id="tasks-modal" class="modal-overlay" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="tasks-modal-title">Редактировать</h3>
        <button type="button" id="tasks-modal-close" class="btn-icon">×</button>
      </div>
      <form id="tasks-edit-form"></form>
      <div class="form-actions">
        <button type="submit" form="tasks-edit-form" class="btn">Применить</button>
        <button type="button" id="tasks-modal-cancel" class="btn secondary">Отмена</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script src="/tasks.js"></script>
  <script src="/app.js"></script>
</body>
</html>
