<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap"/><style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1080px; height:1920px; background:transparent; overflow:hidden; }
body { font-family:"Inter","Helvetica Neue",Arial,sans-serif; -webkit-font-smoothing:antialiased; }
.frame { position:relative; width:1080px; height:1920px; }
.shade-b { position:absolute; left:0; right:0; bottom:0; height:62%;
  background:linear-gradient(180deg, rgba(6,8,15,0) 0%, rgba(6,8,15,.6) 38%, rgba(6,8,15,.94) 100%); }
.brand { position:absolute; top:72px; left:0; right:0; text-align:center;
  font-size:34px; font-weight:800; letter-spacing:.3em; color:#fff; text-transform:uppercase;
  text-shadow:0 2px 14px rgba(6,8,15,.8); }
.brand span { color:#c9a86a; }
.block { position:absolute; left:70px; right:70px; bottom:130px; }
.kick { display:inline-block; font-size:26px; font-weight:800; letter-spacing:.22em; text-transform:uppercase;
  color:#e8d4a8; border-left:8px solid #c9a86a; padding-left:22px; margin-bottom:30px; }
h1 { font-size:88px; font-weight:800; line-height:1.08; letter-spacing:-.015em; color:#fff;
  text-shadow:0 4px 30px rgba(6,8,15,.85); margin-bottom:36px; }
h1 em { font-style:normal; color:#e8d4a8; }
.facts { list-style:none; }
.facts li { position:relative; padding-left:46px; font-size:40px; font-weight:600; line-height:1.32;
  color:rgba(255,255,255,.96); text-shadow:0 3px 18px rgba(6,8,15,.9); margin-bottom:22px; }
.facts li b { color:#e8d4a8; font-weight:800; }
.facts li::before { content:""; position:absolute; left:0; top:22px; width:22px; height:6px; background:#c9a86a; border-radius:3px; }
</style></head><body>
<div class="frame" style="background:
    radial-gradient(120% 90% at 50% -10%, rgba(201,168,106,.16) 0%, transparent 55%),
    linear-gradient(165deg,#0e1a30 0%,#0a0e1a 45%,#06080f 100%);">
  <div class="brand" style="top:120px">Charter <span>Capital</span></div>
  <div style="position:absolute; top:300px; left:0; right:0; text-align:center;">
    <h1 style="font-size:88px; margin-bottom:0">Узнайте больше</h1>
  </div>
  <div style="position:absolute; top:520px; left:50%; transform:translateX(-50%);
      background:#fff; border-radius:36px; padding:44px;">
    <img src="build/qr.png" style="display:block; width:660px; height:660px;"/>
  </div>
  <div style="position:absolute; top:1330px; left:0; right:0; text-align:center;">
    <div style="font-size:60px; font-weight:800; color:#e8d4a8; letter-spacing:.04em;">ccapital.pro</div>
    <div style="margin-top:22px; font-size:36px; font-weight:600; color:rgba(255,255,255,.82);">Сайт · Telegram-дайджест</div>
    <div style="margin-top:60px; font-size:28px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.5);">Наведите камеру на код</div>
  </div>
  <div style="position:absolute; bottom:70px; left:0; right:0; text-align:center; font-size:22px; color:rgba(255,255,255,.4);">
    Работаем только с капиталом подтверждённого законного происхождения. Не является публичной офертой.
  </div>
</div></body></html>
