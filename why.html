<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>THE LOGIC | Charter Capital</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#050505;
  --text:#f8fafc;
  --muted:#94a3b8;
  --blue:#2563eb;
  --border:#1f2937;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--text);
  opacity:0;
  transition:opacity .35s ease;
}
body.page-ready{opacity:1}
#topbar{
  position:fixed;top:0;left:0;right:0;z-index:1000;
  height:60px;
  background:rgba(5,5,5,.9);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}
.topbar-inner{
  max-width:1200px;height:100%;margin:0 auto;padding:0 24px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.topbar-logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}
.topbar-logo-mark{
  width:32px;height:32px;border-radius:6px;background:var(--blue);
  display:flex;align-items:center;justify-content:center;
}
.topbar-logo-mark svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:1.8}
.topbar-brand{font-size:15px;font-weight:600;letter-spacing:-.02em}
.topbar-brand span{color:var(--blue)}
.topbar-links{display:flex;align-items:center;gap:14px}
.topbar-links a,.topbar-links span{
  font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);text-decoration:none;
}
.topbar-links span{color:var(--text)}
main{padding-top:60px}
.logic-frame{
  width:min(1280px,100%);
  margin:0 auto;
  background:#fff;
}
.slide{
  position:relative;
  overflow:hidden;
  border-bottom:1px solid #0b0b0b;
}
.slide img{
  display:block;
  width:100%;
  height:auto;
}
.slide::after{
  content:'';
  position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(0,0,0,0) 70%,rgba(0,0,0,.06) 100%);
  pointer-events:none;
}
.slide.is-dark::after{
  background:linear-gradient(to bottom,rgba(0,0,0,0) 68%,rgba(0,0,0,.22) 100%);
}
@media (max-width: 900px){
  #topbar{height:56px}
  .topbar-inner{padding:0 14px}
  main{padding-top:56px}
  .topbar-brand{font-size:14px}
  .topbar-links{gap:10px}
  .topbar-links a,.topbar-links span{font-size:10px;letter-spacing:.1em}
}
</style>
</head>
<body>
<header id="topbar">
  <div class="topbar-inner">
    <a class="topbar-logo" href="index.html">
      <div class="topbar-logo-mark">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      </div>
      <span class="topbar-brand">Charter <span>Capital</span></span>
    </a>
    <nav class="topbar-links">
      <a href="index.html">Portal</a>
      <span>THE LOGIC</span>
    </nav>
  </div>
</header>

<main>
  <div class="logic-frame">
    <section class="slide is-dark"><img src="assets/logic/01-hero.png" alt="Charter Capital — Архитекторы легитимности" loading="eager"/></section>
    <section class="slide"><img src="assets/logic/02-bank-bio.png" alt="Ваши деньги в РФ — без понятной биографии" loading="lazy"/></section>
    <section class="slide"><img src="assets/logic/03-toxic-routes.png" alt="Токсичные маршруты прошлого" loading="lazy"/></section>
    <section class="slide"><img src="assets/logic/04-singapore-dna.png" alt="Сингапур: трансформация ДНК капитала" loading="lazy"/></section>
    <section class="slide"><img src="assets/logic/05-architecture.png" alt="Архитектура реализации" loading="lazy"/></section>
    <section class="slide"><img src="assets/logic/06-real-asset.png" alt="Реальный актив как фундамент" loading="lazy"/></section>
    <section class="slide"><img src="assets/logic/07-clean-history.png" alt="Чистая финансовая история" loading="lazy"/></section>
    <section class="slide"><img src="assets/logic/08-thailand-hub.png" alt="Таиланд-Пхукет: глобальный хаб" loading="lazy"/></section>
    <section class="slide"><img src="assets/logic/09-footer.png" alt="Charter Capital footer" loading="lazy"/></section>
  </div>
</main>

<script>
document.addEventListener('DOMContentLoaded', function () {
  requestAnimationFrame(function () { document.body.classList.add('page-ready'); });
});

document.addEventListener('click', function (e) {
  var a = e.target.closest('a[href]');
  if (!a || a.target === '_blank' || e.metaKey || e.ctrlKey || e.shiftKey) return;
  var href = a.getAttribute('href');
  if (!href || href.startsWith('#')) return;
  try {
    var u = new URL(a.href, location.href);
    if (u.origin !== location.origin) return;
    if (!/\.html($|[?#])/i.test(u.pathname)) return;
    e.preventDefault();
    document.body.classList.remove('page-ready');
    setTimeout(function () { location.href = a.href; }, 280);
  } catch (_) {}
});
</script>
</body>
</html>
