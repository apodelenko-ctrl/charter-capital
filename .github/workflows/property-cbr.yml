name: Property payments CBR

on:
  workflow_dispatch:
    inputs:
      force_refresh:
        description: Verify the full CBR and Bangkok Bank publication path
        type: boolean
        default: false
  schedule:
    # Reuse the existing hourly job for daily CBR verification and bank publications.
    - cron: '17 * * * *'

permissions:
  contents: write
  pages: write

concurrency:
  group: property-payments-cbr
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Validate calculations and official source parsing
        run: |
          node --test .github/tests/payment_*.test.mjs .github/tests/property_bank.test.cjs
          python3 -m unittest discover -s .github/tests -p 'test_property_cbr.py'

      - name: Refresh today's official CBR rate
        id: cbr
        continue-on-error: true
        env:
          FORCE_REFRESH: ${{ github.event.inputs.force_refresh || 'false' }}
        run: |
          if [[ "$FORCE_REFRESH" == 'true' ]]; then
            python3 .github/scripts/update_property_cbr.py thai-payments/cbr.json --force-refresh
          else
            python3 .github/scripts/update_property_cbr.py thai-payments/cbr.json
          fi

      - name: Prepare the official bank table reader
        id: bank_reader
        continue-on-error: true
        run: npm install --prefix "$RUNNER_TEMP/thaipay-bank" --no-audit --no-fund playwright@1.64.1

      - name: Refresh Bangkok Bank Sight Bill Buying Rates
        id: bank
        if: steps.bank_reader.outcome == 'success'
        continue-on-error: true
        env:
          NODE_PATH: ${{ runner.temp }}/thaipay-bank/node_modules
          FORCE_REFRESH: ${{ github.event.inputs.force_refresh || 'false' }}
        run: |
          if [[ "$FORCE_REFRESH" == 'true' ]]; then
            node .github/scripts/update_property_bank.cjs thai-payments/bangkok-bank.json --force-refresh
          else
            node .github/scripts/update_property_bank.cjs thai-payments/bangkok-bank.json
          fi

      - name: Publish only successful rate changes
        id: publish
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- thai-payments/cbr.json thai-payments/bangkok-bank.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Refresh official property payment exchange rates"
            git fetch origin main:refs/remotes/origin/main gh-pages:refs/remotes/origin/gh-pages
            if [[ "$(git rev-parse origin/main)" != "$(git rev-parse origin/gh-pages)" ]]; then
              echo "Publishing branches differ; refusing to publish unrelated pending changes." >&2
              exit 1
            fi
            git rebase origin/main
            git push --atomic origin HEAD:refs/heads/main HEAD:refs/heads/gh-pages
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build GitHub Pages and verify both published sources
        if: github.ref == 'refs/heads/main' && (steps.publish.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
        uses: actions/github-script@v7
        env:
          PUBLISHED_REVISION: ${{ steps.publish.outputs.revision }}
        with:
          script: |
            const target = {owner: context.repo.owner, repo: context.repo.repo};
            const files = ['cbr.json', 'bangkok-bank.json'];
            const expected = Object.fromEntries(files.map(file => [file, JSON.parse(require('fs').readFileSync('thai-payments/' + file, 'utf8'))]));
            await github.request('POST /repos/{owner}/{repo}/pages/builds', target);
            let built = false;
            for (let attempt = 0; attempt < 30; attempt++) {
              const {data} = await github.request('GET /repos/{owner}/{repo}/pages/builds/latest', target);
              if (data.status === 'built' && data.commit === process.env.PUBLISHED_REVISION) {built = true; break;}
              if (data.status === 'errored' && data.commit === process.env.PUBLISHED_REVISION) throw new Error('GitHub Pages build failed');
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            if (!built) throw new Error('GitHub Pages publication was not confirmed');
            let published = false;
            for (let attempt = 0; attempt < 18; attempt++) {
              try {
                const checks = await Promise.all(files.map(async file => {
                  const response = await fetch('https://ccapital.pro/thai-payments/' + file + '?v=' + process.env.PUBLISHED_REVISION + '&check=' + Date.now(), {cache:'no-store'});
                  if (!response.ok) return false;
                  const actual = await response.json();
                  return Object.keys(expected[file]).every(key => actual[key] === expected[file][key]);
                }));
                if (checks.every(Boolean)) {published = true; break;}
              } catch { /* A completed build can precede CDN propagation. */ }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            if (!published) throw new Error('Published exchange rates do not match their verified sources');
            core.info('Official CBR and Bangkok Bank rates published and read back successfully.');

      - name: Report any upstream failure without hiding a successful source refresh
        if: always()
        env:
          CBR_OUTCOME: ${{ steps.cbr.outcome }}
          BANK_OUTCOME: ${{ steps.bank.outcome }}
        run: |
          if [[ "$CBR_OUTCOME" != 'success' || "$BANK_OUTCOME" != 'success' ]]; then
            echo 'A source failed. Its previous verified data and dates were preserved; inspect this run.' >&2
            exit 1
          fi
