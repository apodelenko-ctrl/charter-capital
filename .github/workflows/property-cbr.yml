name: Property payments CBR

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/property-cbr.yml'
      - '.github/scripts/property_daily_cycle.cjs'
      - '.github/scripts/update_property_bank.cjs'
      - '.github/scripts/update_property_cbr.py'
      - '.github/tests/property_bank.test.cjs'
      - '.github/tests/payment_*.test.mjs'
      - '.github/tests/test_property_cbr.py'
  # Manual and push runs validate only; they cannot refresh or publish rates.
  workflow_dispatch:
  schedule:
    # Reserves recover an unfinished cycle. Cron is best-effort.
    - cron: '0 11 * * *'
      timezone: 'Europe/Moscow'
    - cron: '7 11 * * *'
      timezone: 'Europe/Moscow'
    - cron: '17 11 * * *'
      timezone: 'Europe/Moscow'

permissions:
  contents: write
  pages: write

concurrency:
  group: property-payments-cbr
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Python validation imports must not dirty the strict daily-cycle checkout.
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Validate calculations and official source parsing
        run: |
          node --test .github/tests/payment_*.test.mjs .github/tests/property_bank.test.cjs
          python3 -m unittest discover -s .github/tests -p 'test_property_cbr.py'

      - name: Read authoritative daily state before any source request
        id: cycle
        if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs'), path = require('node:path');
            const daily = require(path.resolve('.github/scripts/property_daily_cycle.cjs'));
            const {owner,repo} = context.repo;
            const response = await fetch('https://api.github.com/repos/'+owner+'/'+repo+'/actions/runs/'+context.runId,{headers:{Accept:'application/vnd.github+json'},signal:AbortSignal.timeout(15000)});
            if (!response.ok) throw new Error('Cannot establish authoritative workflow creation time');
            const run = await response.json();
            if (run.id !== context.runId) throw new Error('Unexpected workflow identity');
            if (run.event !== 'schedule' || run.head_branch !== 'main') throw new Error('Not an approved scheduled run');
            const plan = daily.prepare({cwd:process.cwd(), now:new Date(), runCreatedAt:run.created_at, event:context.eventName, cron:context.payload.schedule});
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'thaipay-daily-plan.json'),JSON.stringify(plan));
            core.setOutput('mode',plan.mode);
            core.info(plan.reason || ('Daily mode: '+plan.mode+', Moscow date: '+plan.day));

      - name: Refresh today's official CBR rate
        id: cbr
        if: github.event_name == 'schedule' && steps.cycle.outputs.mode == 'refresh'
        continue-on-error: true
        env:
          THAIPAY_CYCLE_PLAN: ${{ runner.temp }}/thaipay-daily-plan.json
        run: python3 .github/scripts/update_property_cbr.py thai-payments/cbr.json --force-refresh

      - name: Prepare the official bank table reader
        id: bank_reader
        if: github.event_name == 'schedule' && steps.cycle.outputs.mode == 'refresh'
        continue-on-error: true
        run: npm install --prefix "$RUNNER_TEMP/thaipay-bank" --no-audit --no-fund playwright@1.64.1

      - name: Refresh Bangkok Bank Sight Bill Buying Rates
        id: bank
        if: github.event_name == 'schedule' && steps.cycle.outputs.mode == 'refresh' && steps.bank_reader.outcome == 'success'
        continue-on-error: true
        env:
          NODE_PATH: ${{ runner.temp }}/thaipay-bank/node_modules
          THAIPAY_CYCLE_PLAN: ${{ runner.temp }}/thaipay-daily-plan.json
        run: node .github/scripts/update_property_bank.cjs thai-payments/bangkok-bank.json --force-refresh

      - name: Freeze both verified sources and the Moscow day atomically
        id: publish
        if: github.event_name == 'schedule' && github.ref == 'refs/heads/main' && (steps.cycle.outputs.mode == 'adopt' || (steps.cycle.outputs.mode == 'refresh' && steps.cbr.outcome == 'success' && steps.bank.outcome == 'success'))
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs'), path = require('node:path');
            const daily = require(path.resolve('.github/scripts/property_daily_cycle.cjs'));
            const plan = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'thaipay-daily-plan.json'),'utf8'));
            const revision = daily.commitPair({cwd:process.cwd(),plan});
            core.info('Frozen daily set: '+revision);

      - name: Reconcile Pages and verify the frozen live sources
        id: confirmation
        if: github.event_name == 'schedule' && github.ref == 'refs/heads/main' && (steps.publish.outcome == 'success' || steps.cycle.outputs.mode == 'resume')
        uses: actions/github-script@v7
        with:
          script: |
            const path = require('node:path');
            const daily = require(path.resolve('.github/scripts/property_daily_cycle.cjs'));
            const target = daily.pendingTarget({cwd:process.cwd()});
            if (!target) {core.info('Daily publication already confirmed.');return;}
            const repo = context.repo;
            const proof = await daily.confirmPublication({cwd:process.cwd(),target,
              getLatestBuild:async () => {
                try {return (await github.request('GET /repos/{owner}/{repo}/pages/builds/latest',repo)).data;}
                catch (error) {if (error.status === 404) return null;throw error;}
              },
              requestBuild:() => github.request('POST /repos/{owner}/{repo}/pages/builds',repo),
              readLivePair:async revision => Object.fromEntries(await Promise.all(daily.FILES.map(async file => {
                const response = await fetch('https://ccapital.pro/thai-payments/'+file+'?v='+revision+'&check='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(10000)});
                if (!response.ok) throw new Error('Live rate source unavailable');
                return [file,await response.json()];
              }))),
            });
            daily.acknowledge({cwd:process.cwd(),target,proof});
            core.info('Both frozen official sources were verified live; this Moscow day is complete.');

      - name: Report source failure without changing the previous complete set
        if: always() && github.event_name == 'schedule' && steps.cycle.outputs.mode == 'refresh'
        env:
          CBR_OUTCOME: ${{ steps.cbr.outcome }}
          BANK_OUTCOME: ${{ steps.bank.outcome }}
        run: |
          if [[ "$CBR_OUTCOME" != 'success' || "$BANK_OUTCOME" != 'success' ]]; then
            echo 'Source verification failed; the previous complete set and real dates were preserved.' >&2
            exit 1
          fi
