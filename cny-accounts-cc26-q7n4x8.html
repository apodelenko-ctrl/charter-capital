  <style>
    :root {
      --navy:#08101f; --navy-2:#0e1b31; --ink:#142033; --body:#41506a; --muted:#6d788b;
      --gold:#a9854e; --gold-2:#cfac70; --gold-pale:#f5ead6; --paper:#fff; --wash:#f5f7fa;
      --line:#dfe5ed; --green:#15765a; --green-pale:#e9f6f0; --amber:#93681d; --amber-pale:#fff7e7;
      --red:#9b3f42; --red-pale:#fff0f0; --shadow:0 18px 60px rgba(7,15,29,.15);
      --font:"Helvetica Neue","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      --cjk:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei","Hiragino Sans GB","Source Han Sans SC",sans-serif;
    }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; background:#dfe3e9; }
    body { margin:0; color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.55; }
    button { font:inherit; }
    .lang-zh { font-family:var(--cjk); }
    .switchbar {
      position:sticky; top:0; z-index:30; display:flex; align-items:center; justify-content:center; gap:4px;
      min-height:52px; padding:8px 16px; background:rgba(8,16,31,.96); border-bottom:1px solid rgba(207,172,112,.4);
      backdrop-filter:blur(12px); box-shadow:0 8px 24px rgba(8,16,31,.18);
    }
    .switchbar .switch-label { color:#aeb7c7; font-size:12px; letter-spacing:.08em; text-transform:uppercase; margin-right:10px; }
    .lang-btn {
      min-width:66px; min-height:34px; padding:6px 15px; border:1px solid rgba(255,255,255,.22); border-radius:999px;
      color:#fff; background:transparent; cursor:pointer; transition:.18s ease;
    }
    .lang-btn:hover { border-color:var(--gold-2); color:var(--gold-2); }
    .lang-btn[aria-pressed="true"] { color:var(--navy); background:var(--gold-2); border-color:var(--gold-2); font-weight:800; }
    .language { display:none; width:min(1220px,calc(100% - 32px)); margin:26px auto 52px; background:var(--paper); box-shadow:var(--shadow); }
    body[data-lang="ru"] .lang-ru, body[data-lang="en"] .lang-en, body[data-lang="zh"] .lang-zh { display:block; }
    .masthead {
      position:relative; overflow:hidden; padding:48px clamp(24px,6vw,76px) 42px; color:#fff;
      background:linear-gradient(135deg,var(--navy),#0b1930 68%,#132442);
    }
    .masthead::before { content:""; position:absolute; inset:0; background:radial-gradient(circle at 84% 18%,rgba(207,172,112,.26),transparent 34%); }
    .masthead::after { content:""; position:absolute; left:0; right:0; bottom:0; height:4px; background:linear-gradient(90deg,var(--gold),var(--gold-2),transparent 72%); }
    .mh-top,.hero-copy { position:relative; }
    .mh-top { display:flex; justify-content:space-between; gap:24px; align-items:flex-start; }
    .brand { font-weight:850; text-transform:uppercase; letter-spacing:.2em; font-size:20px; }
    .brand-sub { margin-top:5px; color:#d8bd8d; font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; }
    .confidential { text-align:right; color:#efd8ae; font-size:11px; font-weight:750; letter-spacing:.11em; text-transform:uppercase; line-height:1.7; }
    .hero-copy { margin-top:42px; max-width:1000px; }
    .eyebrow { margin:0 0 10px; color:var(--gold-2); font-size:12px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(32px,5vw,56px); line-height:1.05; letter-spacing:-.035em; font-weight:350; }
    h1 strong { font-weight:790; }
    .tri-title { margin:18px 0 0; color:rgba(255,255,255,.69); font-size:clamp(13px,1.7vw,17px); }
    .badges { display:flex; flex-wrap:wrap; gap:8px; margin-top:23px; }
    .badge { padding:6px 11px; border-radius:999px; border:1px solid rgba(207,172,112,.34); background:rgba(207,172,112,.11); color:#ecd7b1; font-size:12px; font-weight:700; }
    main { padding:clamp(28px,5vw,64px) clamp(20px,6vw,76px) 24px; }
    .intro { display:grid; grid-template-columns:1.15fr .85fr; gap:18px; margin-bottom:46px; }
    .lead-card,.status-card { border:1px solid var(--line); border-radius:14px; padding:23px; background:var(--wash); }
    .lead-card { border-left:4px solid var(--gold); }
    .lead-card p,.status-card p { margin:0; color:var(--body); }
    .status-card { background:linear-gradient(135deg,var(--navy-2),var(--navy)); color:#fff; border:0; }
    .status-card p { color:rgba(255,255,255,.78); }
    .status-card strong { color:var(--gold-2); }
    .chapter { margin:48px 0 0; }
    .chapter-title { display:flex; gap:14px; align-items:flex-start; margin-bottom:20px; }
    .chapter-no { flex:0 0 auto; width:38px; height:38px; display:grid; place-items:center; border-radius:10px; background:linear-gradient(135deg,var(--gold-2),var(--gold)); color:var(--navy); font-weight:900; }
    h2 { margin:0; font-size:clamp(23px,3vw,34px); line-height:1.15; letter-spacing:-.025em; }
    .chapter-title p { margin:6px 0 0; color:var(--muted); }
    h3 { margin:0; font-size:18px; line-height:1.25; }
    .entity-strip { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:18px; }
    .fact { padding:14px 15px; border:1px solid var(--line); background:#fff; border-radius:11px; min-width:0; }
    .fact .k { color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.1em; font-weight:800; }
    .fact .v { margin-top:5px; color:var(--ink); font-weight:720; overflow-wrap:anywhere; }
    .fact .v a,.pack-item a { color:var(--ink); text-decoration-color:var(--gold); text-underline-offset:3px; }
    .fact .v a:hover,.pack-item a:hover { color:var(--gold); }
    .route-grid,.accounts-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
    .route,.account { border:1px solid var(--line); border-radius:13px; padding:18px; background:#fff; break-inside:avoid; }
    .route.ok,.account.ok { border-top:4px solid var(--green); background:linear-gradient(180deg,var(--green-pale),#fff 34%); }
    .route.wait,.account.wait { border-top:4px solid var(--amber); background:linear-gradient(180deg,var(--amber-pale),#fff 34%); }
    .route.no,.account.no { border-top:4px solid var(--red); background:linear-gradient(180deg,var(--red-pale),#fff 34%); }
    .flag { display:inline-block; padding:3px 8px; margin-bottom:9px; border-radius:999px; font-size:10px; font-weight:850; text-transform:uppercase; letter-spacing:.08em; }
    .ok .flag { color:var(--green); background:#d8efe5; } .wait .flag { color:var(--amber); background:#f8e9bf; } .no .flag { color:var(--red); background:#f5dada; }
    .route p,.account p { margin:8px 0 0; color:var(--body); font-size:13px; }
    .bankbox { margin-top:14px; border:1px solid var(--line); border-radius:14px; overflow:hidden; break-inside:avoid; }
    .bank-head { display:flex; justify-content:space-between; gap:16px; align-items:center; padding:16px 19px; color:#fff; background:var(--navy-2); }
    .bank-head span { color:var(--gold-2); font-size:12px; font-weight:750; }
    .bank-grid { display:grid; grid-template-columns:repeat(2,1fr); }
    .bank-row { position:relative; min-height:72px; padding:13px 52px 13px 18px; border-bottom:1px solid var(--line); }
    .bank-row:nth-child(odd) { border-right:1px solid var(--line); }
    .bank-row .k { color:var(--muted); font-size:10px; font-weight:800; letter-spacing:.09em; text-transform:uppercase; }
    .bank-row .v { margin-top:4px; font-weight:720; overflow-wrap:anywhere; }
    .copy-btn { position:absolute; right:10px; top:50%; transform:translateY(-50%); width:30px; height:30px; border:1px solid var(--line); border-radius:8px; color:var(--muted); background:#fff; cursor:pointer; }
    .copy-btn:hover { color:var(--gold); border-color:var(--gold); }
    .copy-btn.copied { color:var(--green); border-color:var(--green); background:var(--green-pale); }
    .formula { position:relative; margin-top:14px; padding:18px 56px 18px 19px; border-radius:12px; color:#fff; background:linear-gradient(135deg,var(--navy-2),var(--navy)); break-inside:avoid; }
    .formula .label { color:var(--gold-2); font-size:10px; letter-spacing:.11em; text-transform:uppercase; font-weight:850; }
    .formula code { display:block; margin-top:7px; color:#fff; font:700 14px/1.5 var(--font); white-space:normal; overflow-wrap:anywhere; }
    .formula .copy-btn { border-color:rgba(255,255,255,.2); background:rgba(255,255,255,.08); color:#fff; }
    .note { margin:12px 0 0; padding:12px 15px; border-left:3px solid var(--gold); background:var(--gold-pale); color:var(--body); font-size:13px; }
    .details-stack { display:grid; gap:10px; margin-top:16px; }
    details { border:1px solid var(--line); border-radius:13px; background:#fff; overflow:hidden; break-inside:avoid; }
    summary { position:relative; list-style:none; cursor:pointer; padding:17px 48px 17px 18px; background:var(--wash); font-weight:800; }
    summary::-webkit-details-marker { display:none; }
    summary::after { content:"+"; position:absolute; right:18px; top:50%; transform:translateY(-50%); color:var(--gold); font-size:24px; font-weight:500; }
    details[open] summary::after { content:"−"; }
    details[open] summary { border-bottom:1px solid var(--line); }
    .purpose-list { padding:2px 18px 12px; }
    .purpose { display:grid; grid-template-columns:64px minmax(130px,.8fr) minmax(0,2.7fr); gap:12px; padding:14px 0; border-bottom:1px solid var(--line); break-inside:avoid; }
    .purpose:last-child { border-bottom:0; }
    .purpose-code { color:var(--gold); font-weight:900; font-size:12px; letter-spacing:.04em; padding-top:2px; }
    .purpose-name { font-weight:800; }
    .purpose-lines { display:grid; gap:7px; }
    .purpose-line { position:relative; padding:8px 42px 8px 10px; border-radius:8px; background:var(--wash); font-size:12px; line-height:1.45; overflow-wrap:anywhere; }
    .purpose-line b { display:inline-block; width:26px; color:var(--gold); font-size:10px; letter-spacing:.06em; }
    .purpose-line .copy-btn { right:6px; width:27px; height:27px; font-size:12px; }
    .pack { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; counter-reset:pack; }
    .pack-item { position:relative; min-height:110px; padding:44px 15px 14px; border:1px solid var(--line); border-radius:11px; background:var(--wash); color:var(--body); font-size:13px; break-inside:avoid; }
    .pack-item::before { counter-increment:pack; content:counter(pack); position:absolute; top:12px; left:14px; width:24px; height:24px; display:grid; place-items:center; border-radius:7px; background:var(--gold); color:#fff; font-weight:900; }
    .flow-split { display:grid; grid-template-columns:1fr auto 1fr; gap:16px; align-items:stretch; margin:18px 0; break-inside:avoid; }
    .flow-card { padding:22px; border-radius:13px; border:1px solid var(--line); }
    .flow-card.yes { background:var(--green-pale); border-color:#b7dfce; }
    .flow-card.direct { background:var(--gold-pale); border-color:#e6d0a8; }
    .flow-card h3 { margin-bottom:8px; }
    .flow-card p { margin:0; color:var(--body); }
    .flow-arrow { display:grid; place-items:center; color:var(--gold); font-size:24px; }
    .faq .answer { padding:15px 18px 18px; color:var(--body); }
    .faq .answer p { margin:0; }
    footer { margin-top:48px; padding:24px clamp(20px,6vw,76px) 27px; color:#bcc5d4; background:var(--navy); font-size:12px; }
    footer strong { color:var(--gold-2); }
    .footer-grid { display:flex; justify-content:space-between; gap:24px; }
    .footer-grid p { margin:0; max-width:78ch; }
    .page-ref { white-space:nowrap; text-align:right; color:#8591a5; }
    @media (max-width:900px) {
      .intro,.route-grid,.accounts-grid { grid-template-columns:1fr; }
      .entity-strip { grid-template-columns:repeat(2,1fr); }
      .bank-grid { grid-template-columns:1fr; }
      .bank-row:nth-child(odd) { border-right:0; }
      .flow-split { grid-template-columns:1fr; }
      .flow-arrow { transform:rotate(90deg); }
      .pack { grid-template-columns:repeat(2,1fr); }
    }
    @media (max-width:620px) {
      .language { width:100%; margin:0; box-shadow:none; }
      .switchbar .switch-label { display:none; }
      .masthead { padding-top:30px; }
      .mh-top,.footer-grid { flex-direction:column; }
      .confidential,.page-ref { text-align:left; }
      .entity-strip,.pack { grid-template-columns:1fr; }
      .purpose { grid-template-columns:46px 1fr; }
      .purpose-lines { grid-column:1 / -1; }
      .bank-head { align-items:flex-start; flex-direction:column; }
    }
    @page { size:A4; margin:11mm 10mm 13mm; }
    @media print {
      html,body { background:#fff; }
      body { font-size:9.1pt; color:#111827; }
      .switchbar,.copy-btn { display:none !important; }
      .language,.lang-ru,.lang-en,.lang-zh { display:block !important; width:auto; margin:0; box-shadow:none; }
      .language + .language { break-before:page; page-break-before:always; }
      .masthead { margin:-11mm -10mm 8mm; padding:15mm 14mm 12mm; print-color-adjust:exact; -webkit-print-color-adjust:exact; }
      h1 { font-size:29pt; }
      main { padding:0; }
      .intro { margin-bottom:8mm; }
      .chapter { margin-top:9mm; }
      .chapter-title { margin-bottom:4mm; }
      h2 { font-size:18pt; }
      .route-grid,.accounts-grid { grid-template-columns:repeat(3,1fr); }
      .entity-strip { grid-template-columns:repeat(4,1fr); }
      .bank-grid { grid-template-columns:repeat(2,1fr); }
      .pack { grid-template-columns:repeat(3,1fr); }
      .flow-split { grid-template-columns:1fr auto 1fr; }
      .flow-arrow { transform:none; }
      details:not([open]) > :not(summary) { display:block !important; }
      summary { padding:11px 15px; }
      summary::after { display:none; }
      .purpose { grid-template-columns:48px minmax(100px,.75fr) minmax(0,2.8fr); padding:10px 0; }
      .purpose-line { padding:6px 8px; font-size:8.5pt; }
      .purpose-list { padding-bottom:7px; }
      .bank-row { min-height:58px; padding:9px 13px; }
      .formula { padding:12px 15px; }
      .pack-item { min-height:0; padding:38px 12px 10px; }
      footer { margin:9mm -10mm -13mm; padding:8mm 10mm; print-color-adjust:exact; -webkit-print-color-adjust:exact; }
      .route,.account,.bankbox,.formula,.pack-item,.flow-split,details,.purpose { break-inside:avoid; page-break-inside:avoid; }
    }
  </style>
</head>
