<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SourceReady Scoring Engine Sandbox v1.1 stable</title>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --panel-bg: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
            --border-color: #e2e8f0;
            --primary: #3182ce;
            --success: #38a169;
            --warning: #d69e2e;
            --danger: #e53e3e;
            --paused: #718096;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            display: flex;
            max-width: 1200px;
            width: 100%;
            gap: 20px;
            flex-wrap: wrap;
        }

        .panel {
            background-color: var(--panel-bg);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
        }

        .left-panel { flex: 1; min-width: 350px; }
        .right-panel { flex: 1.5; min-width: 450px; }

        h2 { margin-top: 0; font-size: 1.2rem; color: var(--text-main); border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        h3 { font-size: 1rem; margin-bottom: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 20px; }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.9rem; }
        
        select, input[type="range"] { width: 100%; }
        select { padding: 8px; border-radius: 4px; border: 1px solid var(--border-color); }
        
        .slider-wrapper { display: flex; align-items: center; gap: 10px; }
        .slider-wrapper input[type="number"] { width: 60px; padding: 5px; text-align: center; border: 1px solid var(--border-color); border-radius: 4px;}

        .checkbox-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .checkbox-label { display: flex; align-items: center; font-weight: normal; font-size: 0.9rem; cursor: pointer; }
        .checkbox-label input { margin-right: 8px; }
        
        .override-wrapper { margin-left: 20px; padding-left: 10px; border-left: 2px solid var(--warning); display: none; }
        .override-wrapper.visible { display: flex; flex-direction: column; gap: 5px; margin-top: 5px; }

        .btn { padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: background 0.2s; margin-bottom: 5px; }
        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover { background-color: #2b6cb0; }
        .btn-outline { background-color: transparent; border: 1px solid var(--border-color); color: var(--text-main); }
        .btn-outline:hover { background-color: #edf2f7; }

        .test-cases { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }

        /* Output Styles */
        .result-card {
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            color: white;
            transition: all 0.3s ease;
        }
        
        .status-ready { background-color: var(--success); }
        .status-reinforcement { background-color: var(--warning); color: #2d3748; }
        .status-elevated { background-color: #dd6b20; }
        .status-insufficient { background-color: var(--danger); }
        .status-paused { background-color: var(--paused); }
        .status-default { background-color: #a0aec0; } 

        .result-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 10px;}
        .result-score { font-size: 3rem; font-weight: 800; line-height: 1; }
        .result-status { font-size: 1.5rem; font-weight: 600; margin-bottom: 5px;}
        .result-mode { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.9; }

        .decision-path { background: #f7fafc; padding: 15px; border-radius: 4px; border: 1px solid var(--border-color); font-family: monospace; font-size: 0.85rem; line-height: 1.5; color: #4a5568; white-space: pre-wrap; height: 350px; overflow-y: auto;}

    </style>
</head>
<body>

<div class="container">
    <div class="panel left-panel">
        <h2>Engine Inputs</h2>
        
        <div class="form-group">
            <label>Engine Profile</label>
            <select id="profileSelect" onchange="runEngine()">
                <option value="market_pragmatic_default">Market Pragmatic Default (65/35)</option>
                <option value="institutional_conservative">Institutional Conservative (55/45)</option>
            </select>
        </div>

        <h3>Domain Scores</h3>
        <div class="form-group">
            <label>D1: Source of Funds Evidence (0-100)</label>
            <div class="slider-wrapper">
                <input type="range" id="d1Slider" min="0" max="100" value="85" oninput="syncInput('d1'); runEngine()">
                <input type="number" id="d1Num" min="0" max="100" value="85" oninput="syncInput('d1', true); runEngine()">
            </div>
        </div>
        <div class="form-group">
            <label>D2: Source of Wealth Coherence (0-100)</label>
            <div class="slider-wrapper">
                <input type="range" id="d2Slider" min="0" max="100" value="70" oninput="syncInput('d2'); runEngine()">
                <input type="number" id="d2Num" min="0" max="100" value="70" oninput="syncInput('d2', true); runEngine()">
            </div>
        </div>

        <h3>Escalation Modifiers</h3>
        <div class="checkbox-group">
            <label class="checkbox-label"><input type="checkbox" id="mod_pep" onchange="runEngine()"> PEP Exposure</label>
            <label class="checkbox-label"><input type="checkbox" id="mod_sanctions" onchange="runEngine()"> Sanctions Adjacency</label>
            <label class="checkbox-label"><input type="checkbox" id="mod_greylist" onchange="runEngine()"> High-Risk Jurisdiction (Greylist)</label>
            <label class="checkbox-label"><input type="checkbox" id="mod_control" onchange="runEngine()"> Unexplained Third-Party Control</label>
        </div>

        <h3>Blocking Modifiers</h3>
        <div class="checkbox-group">
            <label class="checkbox-label"><input type="checkbox" id="mod_integrity" onchange="runEngine()"> Suspected Integrity Breach</label>
            <label class="checkbox-label"><input type="checkbox" id="mod_forgery" onchange="runEngine()"> Suspected Document Forgery</label>
            
            <label class="checkbox-label"><input type="checkbox" id="mod_id_conflict" onchange="toggleOverride('id_conflict'); runEngine()"> Critical Identity Conflict</label>
            <div class="override-wrapper" id="wrap_id_conflict">
                <label class="checkbox-label"><input type="checkbox" id="over_id_conflict" onchange="runEngine()"> Human Override</label>
            </div>

            <label class="checkbox-label"><input type="checkbox" id="mod_timeline" onchange="toggleOverride('timeline'); runEngine()"> Impossible Funds Timeline</label>
            <div class="override-wrapper" id="wrap_timeline">
                <label class="checkbox-label"><input type="checkbox" id="over_timeline" onchange="runEngine()"> Human Override</label>
            </div>

            <label class="checkbox-label"><input type="checkbox" id="mod_blacklist" onchange="toggleOverride('blacklist'); runEngine()"> High-Risk Jurisdiction (Blacklist)</label>
            <div class="override-wrapper" id="wrap_blacklist">
                <label class="checkbox-label"><input type="checkbox" id="over_blacklist" onchange="runEngine()"> Human Override</label>
            </div>
        </div>
        
        <button class="btn btn-outline" onclick="resetForm()" style="width: 100%; margin-top: 10px;">Reset to Default Scenario</button>
    </div>

    <div class="panel right-panel">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 20px;">
            <h2 style="border: none; margin: 0; padding: 0;">Output & Decision Path</h2>
            <button class="btn btn-primary" onclick="copyJSON()">Copy Result as JSON</button>
        </div>

        <div class="test-cases">
            <button class="btn btn-outline" onclick="loadTestCase('ideal_exit')">1. Ideal Exit</button>
            <button class="btn btn-outline" onclick="loadTestCase('broken_chain')">2. Broken Chain</button>
            <button class="btn btn-outline" onclick="loadTestCase('crypto_bridge')">3. Crypto Bridge</button>
            <button class="btn btn-outline" onclick="loadTestCase('pep_client')">4. PEP Client</button>
            <button class="btn btn-outline" onclick="loadTestCase('blacklist_route')">5. Blacklist Route</button>
            <button class="btn btn-outline" onclick="loadTestCase('weak_package')">6. Weak Package</button>
            <button class="btn btn-outline" onclick="loadTestCase('deal_maker')">7. Deal-Maker</button>
            <button class="btn btn-outline" onclick="loadTestCase('borderline_gate')" style="border-color: var(--primary);">8. Borderline Gate</button>
            <button class="btn btn-outline" onclick="loadTestCase('integrity_pause')" style="border-color: var(--danger);">9. Integrity Pause</button>
        </div>

        <div id="resultCard" class="result-card status-default">
            <div class="result-header">
                <div>
                    <div id="finalMode" class="result-mode">AWAITING ENGINE...</div>
                    <div id="finalStatus" class="result-status">Initializing...</div>
                </div>
                <div id="finalScore" class="result-score">--</div>
            </div>
        </div>

        <h3>Decision Path Log</h3>
        <div id="decisionPath" class="decision-path">Loading engine...</div>
    </div>
</div>

<script>
// ==========================================
// 1. ENGINE CONFIGURATION (The "Spec")
// ==========================================
const ENGINE_CONFIG = {
    profiles: {
        market_pragmatic_default: { w_d1: 0.65, w_d2: 0.35 },
        institutional_conservative: { w_d1: 0.55, w_d2: 0.45 }
    },
    tiers: [
        { id: "T1", name: "Submission Ready", min: 85, rank: 1 },
        { id: "T2", name: "Needs Reinforcement", min: 60, rank: 2 },
        { id: "T3", name: "Elevated Review Burden", min: 35, rank: 3 },
        { id: "T4", name: "Insufficient Readiness", min: 0, rank: 4 }
    ],
    floor_rules: [
        { id: "FR1", if: (d1, d2, core) => d1 < 35, maxRank: 3, reason: "D1 < 35 (Weak SoF caps status to Elevated Review Burden)" },
        { id: "FR2", if: (d1, d2, core) => d1 < 20, maxRank: 4, reason: "D1 < 20 (Critically weak SoF caps status to Insufficient Readiness)" },
        { id: "FR3", if: (d1, d2, core) => d2 < 40 && core >= 85, maxRank: 2, reason: "D2 < 40 (Weak SoW prevents Submission Ready)" }
    ],
    gates: {
        submission_ready: { min_d1: 80, min_d2: 60, fail_reason: "D1 must be >= 80 and D2 >= 60 for Submission Ready." }
    }
};

const TEST_CASES = {
    ideal_exit: { d1: 95, d2: 90, mods: [] },
    broken_chain: { d1: 30, d2: 85, mods: [] },
    crypto_bridge: { d1: 45, d2: 60, mods: [] },
    pep_client: { d1: 85, d2: 80, mods: ['mod_pep'] },
    blacklist_route: { d1: 90, d2: 85, mods: ['mod_blacklist'] },
    weak_package: { d1: 25, d2: 30, mods: [] },
    deal_maker: { d1: 90, d2: 78, mods: [] },
    borderline_gate: { d1: 82, d2: 58, mods: [] },
    integrity_pause: { d1: 92, d2: 88, mods: ['mod_integrity'] }
};

let currentResultJSON = null;
let engineHasRun = false;

// ==========================================
// 2. CORE LOGIC ENGINE
// ==========================================
function calculateResult(inputs, config) {
    let log = [];
    let jsonResult = {
        inputs: {
            d1_score: inputs.d1,
            d2_score: inputs.d2,
            profile: inputs.profile,
            active_modifiers: inputs.blocking.concat(inputs.escalation).filter(m => m.active).map(m => m.id)
        },
        selected_profile_weights: config.profiles[inputs.profile],
        raw_score: 0,
        display_score: "--",
        raw_status: "",
        final_mode: "normal",
        final_status: "",
        final_rank: null,
        triggered_floor_rules: [],
        triggered_escalation_modifiers: [],
        triggered_blocking_modifiers: [],
        overridden_blocking_modifiers: [],
        final_status_reason: ""
    };

    log.push(`--- Engine Execution Started ---`);
    log.push(`Profile Selected: ${inputs.profile}`);
    
    // 1. Core Score Calculation
    let w_d1 = config.profiles[inputs.profile].w_d1;
    let w_d2 = config.profiles[inputs.profile].w_d2;
    let rawScore = (inputs.d1 * w_d1) + (inputs.d2 * w_d2);
    rawScore = Math.round(rawScore * 10) / 10;
    
    jsonResult.raw_score = rawScore;
    jsonResult.display_score = rawScore.toString();
    log.push(`Raw Score: ${rawScore} (D1:${inputs.d1}*${w_d1} + D2:${inputs.d2}*${w_d2})`);

    // 2. Raw Tier Mapping
    let rawTier = config.tiers.find(t => rawScore >= t.min);
    jsonResult.raw_status = rawTier.name;
    log.push(`Raw Status: ${rawTier.name} [Rank ${rawTier.rank}]`);

    let currentRank = rawTier.rank;
    let finalStatusName = rawTier.name;
    let suffixes = [];

    // 3. Blocking Modifiers
    let activeBlockers = inputs.blocking.filter(b => b.active && !b.overridden);
    let overriddenBlockers = inputs.blocking.filter(b => b.active && b.overridden);
    
    if (overriddenBlockers.length > 0) {
        let overIds = overriddenBlockers.map(b => b.id);
        jsonResult.overridden_blocking_modifiers = overIds;
        log.push(`Human Overrides Active: ${overIds.join(', ')}`);
    }

    if (activeBlockers.length > 0) {
        let activeBlockerIds = activeBlockers.map(b => b.id);
        jsonResult.triggered_blocking_modifiers = activeBlockerIds;
        
        log.push(`[!] Blocking Modifiers Triggered: ${activeBlockerIds.join(', ')}`);
        
        jsonResult.final_mode = "paused";
        jsonResult.display_score = "--"; 
        finalStatusName = "Manual Expert Review Required";
        jsonResult.final_status_reason = `Scoring paused due to blocking modifiers: ${activeBlockerIds.join(', ')}`;
        
        log.push(`-> Action: Scoring Paused.`);
    } else {
        log.push(`Blocking Modifiers: None (or overridden)`);
        
        // 4. Floor Rules
        config.floor_rules.forEach(rule => {
            if (rule.if(inputs.d1, inputs.d2, rawScore)) {
                log.push(`[!] Floor Rule Triggered: ${rule.reason}`);
                jsonResult.triggered_floor_rules.push(rule.id);
                if (rule.maxRank > currentRank) {
                    currentRank = rule.maxRank;
                    finalStatusName = config.tiers.find(t => t.rank === currentRank).name;
                    jsonResult.final_status_reason = `Status capped by floor rule: ${rule.reason}`;
                    log.push(`-> Action: Status capped to ${finalStatusName}`);
                }
            }
        });

        // 5. Escalation Modifiers
        let activeEscalations = inputs.escalation.filter(e => e.active);
        if (activeEscalations.length > 0) {
            jsonResult.final_mode = "escalated";
            log.push(`[!] Escalation Modifiers Triggered:`);
            activeEscalations.forEach(esc => {
                log.push(`   - ${esc.id}`);
                jsonResult.triggered_escalation_modifiers.push(esc.id);
                suffixes.push(esc.suffix);
                if (esc.maxRank > currentRank) {
                    currentRank = esc.maxRank;
                    finalStatusName = config.tiers.find(t => t.rank === currentRank).name;
                    jsonResult.final_status_reason = `Status capped by escalation: ${esc.id}`;
                    log.push(`     -> Status capped to ${finalStatusName} by ${esc.id}`);
                }
            });
            
            // Fallback reason if escalation didn't cap the status
            if (!jsonResult.final_status_reason) {
                 jsonResult.final_status_reason = `Escalation modifiers active: ${jsonResult.triggered_escalation_modifiers.join(', ')}`;
            }

        } else {
             log.push(`Escalation Modifiers: None`);
        }

        // 6. Submission Ready Gates
        if (currentRank === 1) {
            log.push(`Checking Submission Ready Gates...`);
            if (inputs.d1 < config.gates.submission_ready.min_d1 || inputs.d2 < config.gates.submission_ready.min_d2) {
                currentRank = 2; // Downgrade
                finalStatusName = config.tiers.find(t => t.rank === currentRank).name;
                jsonResult.final_status_reason = config.gates.submission_ready.fail_reason;
                log.push(`[!] Gate Failed: ${config.gates.submission_ready.fail_reason}`);
                log.push(`-> Action: Downgraded to ${finalStatusName}`);
            } else {
                log.push(`Gates Passed.`);
            }
        }
        
        // Final fallback reason for normal flow
        if (!jsonResult.final_status_reason && jsonResult.final_mode === "normal") {
            jsonResult.final_status_reason = "Status assigned from baseline score with no blocking or escalation constraints.";
        }
        
        // Append suffixes
        if (suffixes.length > 0) {
            finalStatusName += " — " + suffixes.join(" | ");
        }
    }

    jsonResult.final_status = finalStatusName;
    jsonResult.final_rank = (jsonResult.final_mode === "paused") ? null : currentRank;
    
    log.push(`--- Execution Complete ---`);
    log.push(`Final Mode: ${jsonResult.final_mode.toUpperCase()}`);
    log.push(`Final Status: ${jsonResult.final_status}`);

    return {
        json: jsonResult,
        log: log.join('\n'),
        rank: jsonResult.final_rank,
        mode: jsonResult.final_mode
    };
}

// ==========================================
// 3. UI CONTROLLER
// ==========================================
function syncInput(id, fromNum = false) {
    if (fromNum) {
        document.getElementById(id + 'Slider').value = document.getElementById(id + 'Num').value;
    } else {
        document.getElementById(id + 'Num').value = document.getElementById(id + 'Slider').value;
    }
}

function toggleOverride(mod) {
    const isChecked = document.getElementById('mod_' + mod).checked;
    const wrap = document.getElementById('wrap_' + mod);
    if (isChecked) {
        wrap.classList.add('visible');
    } else {
        wrap.classList.remove('visible');
        document.getElementById('over_' + mod).checked = false;
    }
}

function getInputs() {
    return {
        profile: document.getElementById('profileSelect').value,
        d1: parseInt(document.getElementById('d1Num').value),
        d2: parseInt(document.getElementById('d2Num').value),
        blocking: [
            { id: 'integrity_breach_suspected', active: document.getElementById('mod_integrity').checked, overridden: false },
            { id: 'document_forgery_suspected', active: document.getElementById('mod_forgery').checked, overridden: false },
            { id: 'critical_identity_conflict', active: document.getElementById('mod_id_conflict').checked, overridden: document.getElementById('over_id_conflict').checked },
            { id: 'impossible_funds_timeline', active: document.getElementById('mod_timeline').checked, overridden: document.getElementById('over_timeline').checked },
            { id: 'high_risk_jurisdiction_blacklist', active: document.getElementById('mod_blacklist').checked, overridden: document.getElementById('over_blacklist').checked }
        ],
        escalation: [
            { id: 'PEP_exposure', active: document.getElementById('mod_pep').checked, maxRank: 2, suffix: 'EDD Required' },
            { id: 'sanctions_adjacency', active: document.getElementById('mod_sanctions').checked, maxRank: 2, suffix: 'Specialist Review Recommended' },
            { id: 'high_risk_jurisdiction_greylist', active: document.getElementById('mod_greylist').checked, maxRank: 2, suffix: 'Jurisdiction Escalation' },
            { id: 'unexplained_third_party_control', active: document.getElementById('mod_control').checked, maxRank: 3, suffix: 'Control Structure Review' }
        ]
    };
}

function runEngine() {
    engineHasRun = true;
    const inputs = getInputs();
    const result = calculateResult(inputs, ENGINE_CONFIG);
    currentResultJSON = result.json;
    
    // Update UI
    document.getElementById('finalScore').innerText = result.json.display_score;
    document.getElementById('finalMode').innerText = `MODE: ${result.json.final_mode.toUpperCase()}`;
    document.getElementById('finalStatus').innerText = result.json.final_status;
    document.getElementById('decisionPath').innerText = result.log;

    // Card Colors
    const card = document.getElementById('resultCard');
    card.className = 'result-card'; // reset
    if (result.mode === 'paused') card.classList.add('status-paused');
    else if (result.rank === 1) card.classList.add('status-ready');
    else if (result.rank === 2) card.classList.add('status-reinforcement');
    else if (result.rank === 3) card.classList.add('status-elevated');
    else if (result.rank === 4) card.classList.add('status-insufficient');
}

function resetForm() {
    document.querySelectorAll('input[type="checkbox"]').forEach(el => el.checked = false);
    document.querySelectorAll('.override-wrapper').forEach(el => el.classList.remove('visible'));
    document.getElementById('d1Slider').value = 85;
    document.getElementById('d2Slider').value = 70;
    syncInput('d1'); syncInput('d2');
    document.getElementById('profileSelect').value = 'market_pragmatic_default';
    runEngine();
}

function loadTestCase(caseId) {
    resetForm();
    const t = TEST_CASES[caseId];
    document.getElementById('d1Slider').value = t.d1;
    document.getElementById('d2Slider').value = t.d2;
    syncInput('d1'); syncInput('d2');
    
    t.mods.forEach(mod => {
        let el = document.getElementById(mod);
        if(el) {
            el.checked = true;
            if(mod === 'mod_blacklist' || mod === 'mod_timeline' || mod === 'mod_id_conflict') {
                toggleOverride(mod.replace('mod_', ''));
            }
        }
    });
    runEngine();
}

function copyJSON() {
    if (!engineHasRun) {
        alert("Please run the engine first.");
        return;
    }
    navigator.clipboard.writeText(JSON.stringify(currentResultJSON, null, 2));
    alert("Result copied to clipboard!");
}

// Auto-initialize default state on load
runEngine();
</script>

</body>
</html>
